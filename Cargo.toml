[workspace]
resolver = "2"
members = ["apps/desktop/src-tauri", "apps/launcher/src-tauri", "crates/*"]

[workspace.package]
edition = "2021"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
